openapi: 3.0.0
info:
  title: CAB System - Authentication API
  description: |
    API hỗ trợ đăng ký tài khoản khách hàng và đăng nhập vào CAB System.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local server

paths:
  /auth/register:
    post:
      summary: Register customer account
      operationId: registerCustomer
      tags:
        - Authentication
      requestBody:
        description: Customer information for registration
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email or phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login
      operationId: login
      tags:
        - Authentication
      requestBody:
        description: User login information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - full_name
        - email
        - phone
        - password
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
            - STAFF
            - MANAGER
        status:
          type: string

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
