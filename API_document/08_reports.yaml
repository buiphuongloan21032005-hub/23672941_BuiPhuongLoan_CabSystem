openapi: 3.0.0
info:
  title: CAB System - Reports API
  description: |
    API cho phép quản lý xem báo cáo cơ bản về số lượng chuyến và doanh thu.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local server

paths:
  /reports/trips:
    get:
      summary: Get trip count report
      operationId: getTripReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trip count report
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_trips:
                    type: integer
                    format: int64

  /reports/revenue:
    get:
      summary: Get revenue report
      operationId: getRevenueReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Revenue report
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_revenue:
                    type: number
                    format: double

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
