openapi: 3.0.0
info:
  title: CAB System - Trip API
  description: |
    API hỗ trợ đặt xe, tự động gán tài xế, theo dõi chuyến, hủy chuyến,
    xem lịch sử và cập nhật trạng thái chuyến.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local server

paths:
  /trips:
    post:
      summary: Create a new trip
      operationId: createTrip
      tags:
        - Trips
      security:
        - bearerAuth: []
      requestBody:
        description: Trip request from customer
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid trip information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get customer trip history
      operationId: getTripHistory
      tags:
        - Trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of customer trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /trips/{tripId}:
    get:
      summary: Get trip by ID
      operationId: getTripById
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Trip found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found

  /trips/{tripId}/cancel:
    put:
      summary: Cancel a trip
      operationId: cancelTrip
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip
          schema:
            type: integer
            format: int64
      requestBody:
        description: Cancellation reason
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_reason:
                  type: string
      responses:
        '200':
          description: Trip cancelled successfully
        '400':
          description: Trip cannot be cancelled

  /driver/trips:
    get:
      summary: Get trips assigned to current driver
      operationId: getDriverTrips
      tags:
        - Trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of assigned trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /driver/trips/{tripId}/status:
    put:
      summary: Update trip status
      operationId: updateTripStatus
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip
          schema:
            type: integer
            format: int64
      requestBody:
        description: New trip status
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_status
              properties:
                trip_status:
                  type: string
                  enum:
                    - DRIVER_ARRIVED
                    - PICKED_UP
                    - IN_PROGRESS
                    - COMPLETED
      responses:
        '200':
          description: Trip status updated successfully
        '400':
          description: Invalid trip status sequence

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateTripRequest:
      type: object
      required:
        - pickup_address
        - destination_address
        - vehicle_type
      properties:
        pickup_address:
          type: string
        destination_address:
          type: string
        vehicle_type:
          type: string
          enum:
            - MOTORBIKE
            - CAR

    Trip:
      type: object
      properties:
        trip_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
          nullable: true
        pickup_address:
          type: string
        destination_address:
          type: string
        vehicle_type:
          type: string
        trip_status:
          type: string
          enum:
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
            - NO_DRIVER
            - CANCELLED
        fare_amount:
          type: number
          format: double
          nullable: true
        cancel_reason:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
